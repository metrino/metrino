apiVersion: v2
name: metrino
description: A Helm chart for Kubernetes
type: application
version: 0.0.0 # overwritten by chart publish CI
appVersion: "0.0.0" # overwritten by chart publish CI

dependencies:
  - name: postgresql
    repository: "https://charts.bitnami.com/bitnami"
    version: "18.11.3"
  - name: trino
    repository: "https://trinodb.github.io/charts"
    version: "1.45.0"
  - name: prometheus
    repository: "https://prometheus-community.github.io/helm-charts"
    version: "29.40.3"
    condition: prometheus.enabled
