apiVersion: v1
kind: Service
metadata:
  name: {{ include "metrino.metabase.serviceName" . }}
  labels:
    {{- include "metrino.labels" . | nindent 4 }}
    app.kubernetes.io/component: metabase
spec:
  selector:
    {{- include "metrino.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: metabase
  ports:
    - name: metabase-main
      protocol: TCP
      port: 80
      targetPort: 3000
    - name: metabase-metrics
      protocol: TCP
      port: 9191
      targetPort: 9191
