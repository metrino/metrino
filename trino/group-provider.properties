# Reads each Trino user's groups from the file the Metabase sync (trino/identity/cmd/metabase-sync) writes, so OPA
# sees them in input.context.identity.groups. The Trino username is the user's email (X-Trino-User from the
# reverse proxy).
# Compose only: mounted by compose.yaml. Helm has its own copy in helm/values.yaml
# (trino.coordinator.additionalConfigFiles); keep the two in sync.
group-provider.name=file
# Must exist when Trino starts; the sync writes an empty one first.
file.group-file=/etc/trino-groups/group.txt
# How often Trino rereads the file.
file.refresh-period=5s
