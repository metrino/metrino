# Sends every access check to OPA (helm/opa/policy.rego). Trino fails closed: no OPA, no queries.
# Compose only. Helm writes the same properties in helm/values.yaml (trino.accessControl), pointed at its OPA
# sidecar; keep the two in sync.
access-control.name=opa
opa.policy.uri=http://opa:8181/v1/data/trino/allow
# One request for all of a query's column masks instead of one per column.
opa.policy.batch-column-masking-uri=http://opa:8181/v1/data/trino/batchColumnMasks
