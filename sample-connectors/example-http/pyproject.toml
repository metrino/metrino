[project]
name = "example-http"
version = "0.2.0"
description = "Example HTTP Connector for Metrino"
readme = "README.md"
authors = [
    { name = "Steve Park", email = "stevepk1234@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.6",
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
example-http = "example_http:app"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
