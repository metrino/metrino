$kind: http-request
description: ""
url: http://localhost:8080/api/session
method: POST
body:
  type: json
  content: |-
    {
        "username":"{{ADMIN_EMAIL}}",
        "password":"{{ADMIN_PASS}}",
        "remember":false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Login with admin credentials returns token", function() {
          pm.response.to.have.status(200);
          const token = pm.response.json().id;
          pm.expect(token).to.lengthOf(36);
          pm.environment.set('METABASE_ADMIN_TOKEN', token);
      }) 
    language: text/javascript
  - type: beforeRequest
    code: |-
      pm.test("Check the credentials", () => {
          pm.expect(pm.environment.get('ADMIN_EMAIL')).to.be.a("string");
          pm.expect(pm.environment.get('ADMIN_PASS')).to.be.a("string");
      });
    language: text/javascript
order: 2000
