$kind: http-request
description: "Only Administrators get the admin pages, so a Teacher is refused"
url: localhost:8000/admin/
method: GET
headers:
  - key: X-Forwarded-Email
    value: "{{TEACHER_EMAIL}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Admin page as Teacher", function() {
          pm.response.to.have.status(403);
      });
    language: text/javascript
order: 4000
